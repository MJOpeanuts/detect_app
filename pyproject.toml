[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nuts-vision-desktop"
version = "0.1.0"
description = "Application locale de détection de composants électroniques."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.5.3,<3",
    "onnxruntime>=1.30.0,<2",
    "Pillow>=12.3.0,<13",
    "PySide6>=6.11.2,<7",
    "SQLAlchemy>=2.1.3,<3",
]

[project.scripts]
nuts-vision = "detect_app.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/nutsvision" = ["ic_detect_best.onnx", "nuts-app.png"]
